name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OTEL_CONSOLE: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check src tests evals
      - run: uv run pytest -q
      - name: Evaluation gate (recorded responses)
        run: uv run python evals/run.py --mode replay
      - name: Container image builds
        run: docker build -t llm-service-starter .
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-report
          path: evals/report.md
