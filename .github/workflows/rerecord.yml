name: re-record against the live model

# Weekly drift check: calls the model for every case and fails if the gate no longer passes.
on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    env:
      OTEL_CONSOLE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run python evals/run.py --mode live
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-eval-report
          path: evals/report.md
